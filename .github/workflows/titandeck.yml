name: TitanDeck

# Builds and tests TitanDeck on a GitHub macOS runner (there's no Xcode on
# iPad), then optionally signs it and uploads it to TestFlight.
# Setup for the TestFlight half: TitanDeck/docs/TESTFLIGHT_SETUP.md
#
# FreeRDP (the RDP library) is built once per recipe in TitanDeck/FreeRDP and
# published as a GitHub release asset, so normal builds just download it.
on:
  push:
    paths:
      - 'TitanDeck/**'
      - '.github/workflows/titandeck.yml'
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload this build to TestFlight
        type: boolean
        default: true

concurrency:
  group: titandeck-${{ github.ref }}
  # Don't cancel: a half-finished FreeRDPKit build would just start again.
  cancel-in-progress: false

jobs:
  freerdp:
    name: FreeRDPKit (built once per recipe)
    runs-on: macos-15
    timeout-minutes: 150
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out package tag
        id: tag
        run: echo "tag=$(TitanDeck/FreeRDP/package-tag.sh)" >> "$GITHUB_OUTPUT"

      - name: Check for a published package
        id: exists
        run: |
          if gh release view "${{ steps.tag.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::FreeRDPKit ${{ steps.tag.outputs.tag }} already published - skipping build."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.exists.outputs.found == 'false'
        with:
          xcode-version: latest-stable

      - name: Build FreeRDPKit
        if: steps.exists.outputs.found == 'false'
        run: TitanDeck/FreeRDP/build.sh "$RUNNER_TEMP/freerdpkit"

      - name: Publish FreeRDPKit
        if: steps.exists.outputs.found == 'false'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          cd "$RUNNER_TEMP/freerdpkit"
          zip -qry FreeRDPKit.zip FreeRDPKit.xcframework FreeRDPHeaders FreeRDPKit.versions.env
          gh release create "$TAG" FreeRDPKit.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "FreeRDPKit $TAG" \
            --notes "Prebuilt FreeRDP + OpenSSL static libraries for TitanDeck (iPad + iOS Simulator). Built by CI from TitanDeck/FreeRDP. Not an app release."

  build-and-test:
    name: Build and test (iPad Simulator)
    needs: freerdp
    # Xcode 27.1 or later (the xcode-27 image): apps built with an older SDK
    # open letterboxed, in a phone-sized window, on iPhone Duo's inner display.
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: TitanDeck
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Fetch FreeRDPKit
        run: FreeRDP/fetch.sh

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPad simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True)
                     if "iOS" in runtime for d in ds if "iPad" in d["name"]))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Build and run unit tests
        run: |
          xcodebuild test \
            -project TitanDeck.xcodeproj \
            -scheme TitanDeck \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/TitanDeckTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Keep test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TitanDeckTests.xcresult
          path: ${{ runner.temp }}/TitanDeckTests.xcresult

  testflight:
    name: Upload to TestFlight
    needs: build-and-test
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.testflight) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # Xcode 27.1, as build-and-test (or iPhone Duo letterboxes the app).
    runs-on: xcode-27
    timeout-minutes: 45
    # One upload at a time, from any branch, so a run never revokes another's
    # fresh certificate mid-archive.
    concurrency:
      group: testflight-upload
      cancel-in-progress: false
    defaults:
      run:
        working-directory: TitanDeck
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check signing secrets
        id: secrets
        working-directory: .
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TestFlight upload skipped - signing secrets not set yet. See TitanDeck/docs/TESTFLIGHT_SETUP.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          xcode-version: '27.1'

      - name: Fetch FreeRDPKit
        if: steps.secrets.outputs.ready == 'true'
        run: FreeRDP/fetch.sh

      - name: Generate Xcode project
        if: steps.secrets.outputs.ready == 'true'
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write App Store Connect key
        if: steps.secrets.outputs.ready == 'true'
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Revoke certificates from earlier CI runs
        if: steps.secrets.outputs.ready == 'true'
        # Each run's Mac makes a development certificate and then vanishes with
        # its private key; left alone they hit Apple's limit and archiving fails.
        continue-on-error: true
        run: python3 Tools/revoke_ci_certificates.py

      - name: Archive
        if: steps.secrets.outputs.ready == 'true'
        run: |
          xcodebuild archive \
            -project TitanDeck.xcodeproj \
            -scheme TitanDeck \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TitanDeck.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export and upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TitanDeck.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Build ${{ github.run_number }} uploaded. It appears in TestFlight after Apple finishes processing (usually 5-20 minutes)."

      - name: Set TestFlight notes from CHANGELOG.md
        if: steps.secrets.outputs.ready == 'true'
        # Nice to have: a hiccup here shouldn't mark a good upload as failed.
        continue-on-error: true
        timeout-minutes: 20
        run: python3 Tools/testflight_notes.py --build "${{ github.run_number }}"

      - name: Remove key
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
