name: Deploy lighting companion to GitHub Pages

# The lighting companion is sidelined while TitanDeck is built. It still
# deploys from main, but only when something under lighting-companion/ changes.
on:
  push:
    branches: [main]
    paths:
      - 'lighting-companion/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lighting-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lighting-companion/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          BASE_URL: /SLAPP/
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lighting-companion/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
