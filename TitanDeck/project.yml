# XcodeGen spec - `xcodegen generate` turns this into TitanDeck.xcodeproj.
# The .xcodeproj is not committed; CI generates it on every build.
name: TitanDeck
options:
  bundleIdPrefix: uk.co.elexproductions
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en-GB

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Keep in step with the top entry of CHANGELOG.md (a unit test checks).
    MARKETING_VERSION: "0.31.1"
    CURRENT_PROJECT_VERSION: "1"
    # iPhone + iPad. Layout follows size classes (see CLAUDE.md), so iPhone
    # Duo's inner display gets the full deck layout.
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  StreamDeckKit:
    url: https://github.com/elgatosf/streamdeck-kit-ipad
    from: "1.3.0"

targets:
  TitanDeck:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources/Assets.xcassets
      # Companion fixture library and gels (Tools/export_companion_data.ts).
      - Resources/Companion
      # Shown in Settings > About > What's New, and as TestFlight notes.
      - path: CHANGELOG.md
        buildPhase: resources
    dependencies:
      - package: StreamDeckKit
        product: StreamDeckKit
      # On-screen virtual deck, shown from Settings (all builds, for testing).
      - package: StreamDeckKit
        product: StreamDeckSimulator
      # FreeRDP + OpenSSL, prebuilt static libraries - run FreeRDP/fetch.sh first.
      - framework: Vendor/FreeRDPKit.xcframework
        embed: false
      - sdk: libz.tbd
      - sdk: libc++.tbd
      - sdk: libiconv.tbd
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CFNetwork.framework
      # Apple Watch GO button, embedded in the iPhone app.
      - target: TitanDeckWatch
    entitlements:
      path: Resources/TitanDeck.entitlements
      properties:
        # Required by Stream Deck Kit to talk to the Elgato driver.
        com.apple.developer.driverkit.communicates-with-drivers: true
        # Wi-Fi network name and access point in the connection details panel.
        com.apple.developer.networking.wifi-info: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: TitanDeck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPhone (outer display on iPhone Duo): upright for the deck, sideways
        # for the remote desktop or propped up like a tent.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: TitanDeck talks to the Titan PC on your show network to fire playbacks and show its screen.
        # "Open in TitanDeck" / Share > TitanDeck for any file: it goes into the
        # Send to PC queue (FileDrop). Copied into Documents/Inbox, not opened in place.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Any file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.data
              - public.content
        LSSupportsOpeningDocumentsInPlace: false
        NSPhotoLibraryUsageDescription: TitanDeck sends the photos and videos you pick to the Titan PC.
        # iOS only shares the Wi-Fi name and access point with apps allowed Location.
        NSLocationWhenInUseUsageDescription: TitanDeck shows which Wi-Fi network and access point the iPad is on, to help diagnose the link to the Titan PC. It never records where you are.
        # Browsed only to detect whether Local Network access is allowed.
        NSBonjourServices:
          - _titandeck._tcp
          - _titandeck-host._tcp
        NSAppTransportSecurity:
          # Titan's WebAPI is plain HTTP on the local network.
          NSAllowsLocalNetworking: true
        # Only standard (exempt) encryption so far. Revisit at M5 when FreeRDP's TLS goes in.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.elexproductions.titandeck
        PRODUCT_NAME: TitanDeck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # C bridge to FreeRDP (Sources/Remote/Bridge).
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Remote/Bridge/TitanDeck-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/FreeRDPHeaders
        GCC_C_LANGUAGE_STANDARD: gnu2x
        # Apple Developer team - lets Xcode on the Mac sign without picking a team.
        DEVELOPMENT_TEAM: 5H3SZY2925
        ENABLE_PREVIEWS: YES

  TitanDeckWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - Watch
      # Shared with the phone app: the Titan client and the Watch message format.
      - Sources/Titan/TitanAction.swift
      - Sources/Titan/TitanEndpoints.swift
      - Sources/Titan/TitanClient.swift
      - Sources/Titan/TitanHandles.swift
      - Sources/Titan/TitanSelection.swift
      - Sources/Support/Logger.swift
      - Sources/Support/WatchCommand.swift
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: TitanDeck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: uk.co.elexproductions.titandeck
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.elexproductions.titandeck.watchkitapp
        PRODUCT_NAME: TitanDeckWatch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5H3SZY2925

  TitanDeckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: TitanDeck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.elexproductions.titandeck.tests
        # The app's bridging header is re-imported by @testable import.
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/FreeRDPHeaders $(SRCROOT)/Sources/Remote/Bridge

schemes:
  TitanDeck:
    build:
      targets:
        TitanDeck: all
        TitanDeckTests: [test]
    test:
      targets:
        - TitanDeckTests
    archive:
      config: Release
