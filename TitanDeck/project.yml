# XcodeGen spec - `xcodegen generate` turns this into TitanDeck.xcodeproj.
# The .xcodeproj is not committed; CI generates it on every build.
name: TitanDeck
options:
  bundleIdPrefix: uk.co.elexproductions
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en-GB

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "2"

packages:
  StreamDeckKit:
    url: https://github.com/elgatosf/streamdeck-kit-ipad
    from: "1.3.0"

targets:
  TitanDeck:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources/Assets.xcassets
    dependencies:
      - package: StreamDeckKit
        product: StreamDeckKit
    entitlements:
      path: Resources/TitanDeck.entitlements
      properties:
        # Required by Stream Deck Kit to talk to the Elgato driver.
        com.apple.developer.driverkit.communicates-with-drivers: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: TitanDeck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: TitanDeck talks to the Titan PC on your show network to fire playbacks and show its screen.
        NSAppTransportSecurity:
          # Titan's WebAPI is plain HTTP on the local network.
          NSAllowsLocalNetworking: true
        # Only standard (exempt) encryption so far. Revisit at M5 when FreeRDP's TLS goes in.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.elexproductions.titandeck
        PRODUCT_NAME: TitanDeck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Apple Developer team - lets Xcode on the Mac sign without picking a team.
        DEVELOPMENT_TEAM: 5H3SZY2925
        ENABLE_PREVIEWS: YES

  TitanDeckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: TitanDeck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.elexproductions.titandeck.tests

schemes:
  TitanDeck:
    build:
      targets:
        TitanDeck: all
        TitanDeckTests: [test]
    test:
      targets:
        - TitanDeckTests
    archive:
      config: Release
